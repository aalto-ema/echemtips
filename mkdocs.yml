site_name: eChemTips
site_description: Control, analysis, and hardware documentation for scanning electrochemistry
site_url: https://aalto-ema.github.io/echemtips/
repo_url: https://github.com/aalto-ema/echemtips
repo_name: aalto-ema/echemtips
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    primary: teal
    accent: teal
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_source: true
            filters:
              - "!^_"
nav:
  - Getting started:
      - Overview: index.md
      - Installation and simulation: INSTALLATION.md
  - Operating an instrument:
      - Hardware setup: REAL_HARDWARE_SETUP.md
      - Calibration: CALIBRATION.md
      - Experiments and controls: OPERATOR_GUIDE.md
      - Advanced scans: ADVANCED_SCANS.md
      - Troubleshooting: TROUBLESHOOTING.md
  - Analysis:
      - Workflows and exports: ANALYSIS_GUIDE.md
      - Optional scientific tools:
          - SECCM transport models: SECCM_MODELS.md
          - Experimental area normalization: AREA_NORMALIZATION.md
  - Reference:
      - Settings: SETTINGS_REFERENCE.md
      - Recording format: DATA_FORMAT.md
  - Developers:
      - Architecture: ARCHITECTURE.md
      - FPGA contract: HARDWARE_INTEGRATION.md
      - Python API: API_REFERENCE.md
      - Optional controller-specific tester: PICOMOTOR_TEST.md
strict: true
